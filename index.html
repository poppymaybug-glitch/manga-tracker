<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Трекер глав — Команда перевода</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #181b22;
      --surface-2: #202530;
      --border: #2c3342;
      --text: #eef1f6;
      --muted: #9aa3b2;
      --accent: #6c8cff;
      --ok: #2ecc71;
      --ok-bg: rgba(46, 204, 113, 0.14);
      --warn: #f39c12;
      --warn-bg: rgba(243, 156, 18, 0.14);
      --danger: #e74c3c;
    }

    * { box-sizing: border-box; }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .app {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 100%;
    }

    .topbar > div:first-child {
      min-width: 0;
      flex: 1 1 200px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 18px;
    }

    .sub {
      font-size: 12px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .mode-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: var(--surface-2);
      padding: 4px;
      border-radius: 10px;
      align-items: center;
      max-width: 100%;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 500;
      transition: 0.15s ease;
      max-width: 100%;
    }

    button:hover:not(:disabled) {
      border-color: var(--accent);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.btn-take {
      background: rgba(108, 140, 255, 0.16);
      border-color: var(--accent);
      color: #c8d6ff;
      font-weight: 600;
    }

    button.btn-done {
      background: var(--ok);
      border-color: var(--ok);
      color: #0b1910;
      font-weight: 600;
    }

    button.btn-reopen {
      background: transparent;
      border-color: var(--warn);
      color: var(--warn);
    }

    button.btn-danger {
      background: transparent;
      border-color: var(--danger);
      color: var(--danger);
    }

    button.btn-danger-solid {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
      font-weight: 600;
    }

    button.btn-small {
      padding: 4px 9px;
      font-size: 12px;
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
      }
      .mode-switch button {
        padding: 6px 9px;
        font-size: 12px;
      }
      .mode-switch button.btn-small {
        padding: 5px 8px;
        font-size: 11px;
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      max-width: 100%;
    }

    .panel.archived,
    .chapter-card.archived {
      opacity: 0.58;
      background: #14171d;
      border-style: dashed;
    }

    .panel-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .list-toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      max-width: 100%;
    }

    .label-inline {
      font-size: 13px;
      color: var(--muted);
      margin-right: 4px;
    }

    .role-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .role-chip.bound::after {
      content: "★";
      font-size: 11px;
      color: #ffd166;
    }

    .chapter-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      max-width: 100%;
    }

    .chapter-card.locked {
      opacity: 0.52;
      background: #14171d;
      border-style: dashed;
    }

    .chapter-card.done-muted {
      opacity: 0.62;
      background: #151820;
      border-color: #262c38;
    }

    .chapter-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .chapter-title {
      font-size: 15px;
      font-weight: 700;
    }

    .badge {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      max-width: 100%;
    }

    .badge.ok {
      color: var(--ok);
      border-color: rgba(46, 204, 113, 0.35);
      background: var(--ok-bg);
    }

    .badge.work {
      color: var(--warn);
      border-color: rgba(243, 156, 18, 0.35);
      background: var(--warn-bg);
    }

    .badge.avail {
      color: #b7c8ff;
      border-color: rgba(108, 140, 255, 0.35);
      background: rgba(108, 140, 255, 0.12);
    }

    .badge.closed {
      color: #c2c8d4;
      border-color: #424a5c;
      background: #232833;
    }

    .badge.err {
      color: #ff8a80;
      border-color: rgba(231, 76, 60, 0.45);
      background: rgba(231, 76, 60, 0.14);
    }

    .meta-line {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .roles-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .role-mini {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 7px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .role-mini.done {
      border-color: rgba(46, 204, 113, 0.45);
      color: #a7f3c5;
      background: rgba(46, 204, 113, 0.1);
    }

    .role-mini.taken {
      border-color: rgba(243, 156, 18, 0.45);
      color: #ffd28a;
      background: rgba(243, 156, 18, 0.11);
    }

    .role-mini.ready {
      border-color: rgba(108, 140, 255, 0.4);
      color: #c8d6ff;
      background: rgba(108, 140, 255, 0.1);
    }

    .member-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 9px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .member-row:last-child {
      margin-bottom: 0;
    }

    .editor-box {
      margin-top: 12px;
      border-top: 1px solid var(--border);
      background: var(--surface-2);
      padding: 12px;
      border-radius: 10px;
    }

    .confirm-box {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 9px;
      border: 1px solid rgba(231, 76, 60, 0.45);
      background: rgba(231, 76, 60, 0.1);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .confirm-warn-box {
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid rgba(243, 156, 18, 0.45);
      background: rgba(243, 156, 18, 0.1);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .grid-roles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
      margin: 10px 0;
    }

    .role-dl-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .role-dl-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
    }

    input[type="text"], input[type="password"], select {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 7px;
      padding: 6px 8px;
      font-size: 13px;
      width: 100%;
      max-width: 100%;
    }

    select {
      width: auto;
      min-width: 150px;
    }

    input.compact {
      width: auto;
      min-width: 140px;
    }

    .add-form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      max-width: 100%;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>

  <script>
    const STORAGE_KEY = "manga_tracker_gsheets_v2";
    const LEAD_PASSCODE = "renaissera";
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwpv6iKuaDlSWm7zS6qu6waejWIUI5jLPc6tQ5gLSqLOZbRSCZgryKvan1DHZFpOF4Y/exec";

    const PROJECT_STATUSES = {
      active: "В работе",
      on_hold: "На перерыве",
      completed: "Завершено",
      dropped: "Брошено"
    };

    const WORKFLOW_MODES = {
      classic: {
        label: "Классический",
        deps: {
          clean: [],
          translate: [],
          edit: ["translate"],
          sound: ["translate", "clean"],
          typeset: ["edit", "sound"],
          beta: ["typeset"]
        }
      },
      typeset_first: {
        label: "Тайп перед звуком",
        deps: {
          clean: [],
          translate: [],
          edit: ["translate"],
          typeset: ["edit", "clean"],
          sound: ["typeset"],
          beta: ["sound"]
        }
      },
      parallel: {
        label: "Параллельно",
        deps: {
          clean: [],
          translate: [],
          edit: ["translate"],
          typeset: ["edit", "clean"],
          sound: ["translate", "clean"],
          beta: ["typeset", "sound"]
        }
      },
      unrestricted: {
        label: "Без привязки",
        deps: {
          clean: [],
          translate: [],
          edit: [],
          sound: [],
          typeset: [],
          beta: []
        }
      }
    };

    const ROLES = [
      { id: "clean", name: "Клин" },
      { id: "translate", name: "Перевод" },
      { id: "edit", name: "Редактура" },
      { id: "sound", name: "Звук" },
      { id: "typeset", name: "Тайп" },
      { id: "beta", name: "Бета" }
    ];

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getCurrentTgUser() {
      const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
      if (tgUser && tgUser.id) {
        return tgUser;
      }
      return null;
    }

    function getCurrentUserKey() {
      const tgUser = getCurrentTgUser();
      if (tgUser && tgUser.id) {
        return `tg_${tgUser.id}`;
      }
      return "local_guest";
    }

    function formatTgUserLabel(tgUser, fallbackKey = "") {
      if (tgUser && (tgUser.first_name || tgUser.username || tgUser.id)) {
        const namePart = (tgUser.first_name || "").trim();
        const handlePart = tgUser.username ? `@${tgUser.username}` : (tgUser.id ? `ID ${tgUser.id}` : "");
        if (namePart && handlePart) return `${namePart} (${handlePart})`;
        return namePart || handlePart;
      }
      if (fallbackKey === "local_guest") return "Локальный профиль";
      return fallbackKey || "Профиль";
    }

    function getActorDisplayName() {
      const tgUser = getCurrentTgUser();
      const userKey = getCurrentUserKey();
      return formatTgUserLabel(tgUser, userKey);
    }

    function makeDoneMap(partial = {}) {
      return {
        clean: Boolean(partial.clean),
        translate: Boolean(partial.translate),
        edit: Boolean(partial.edit),
        sound: Boolean(partial.sound),
        typeset: Boolean(partial.typeset),
        beta: Boolean(partial.beta)
      };
    }

    function makeTakenByMap(partial = {}) {
      return {
        clean: partial.clean || "",
        translate: partial.translate || "",
        edit: partial.edit || "",
        sound: partial.sound || "",
        typeset: partial.typeset || "",
        beta: partial.beta || ""
      };
    }

    function makeDeadlinesMap(partial = {}) {
      return {
        clean: partial.clean || "",
        translate: partial.translate || "",
        edit: partial.edit || "",
        sound: partial.sound || "",
        typeset: partial.typeset || "",
        beta: partial.beta || ""
      };
    }

    function normalizeChapter(ch) {
      const done = makeDoneMap(ch && ch.done);
      const rawTaken = makeTakenByMap(ch && ch.takenBy);
      ROLES.forEach((r) => {
        if (done[r.id]) {
          rawTaken[r.id] = "";
        }
      });
      return {
        ...ch,
        done,
        takenBy: rawTaken,
        roleDeadlines: makeDeadlinesMap(ch && ch.roleDeadlines),
        isEditing: Boolean(ch && ch.isEditing)
      };
    }

    const DEFAULT_STATE = {
      mode: "member",
      leadUnlocked: false,
      showLeadAuthPrompt: false,
      leadAuthError: false,
      confirmDeleteProjectId: null,
      confirmDeleteUserKey: null,
      confirmReopenKey: null,
      showCompletedChapters: false,
      onlyMyRoles: true,
      selectedProjectId: "lotus",
      selectedRoleId: "edit",
      userBoundRoles: {},
      knownUsers: {},
      projects: {
        lotus: {
          id: "lotus",
          name: "Лотос",
          status: "active",
          workflowMode: "classic",
          note: "Пачки по 2 главы · Клин/Перевод: ср–пт · Редактура/Звук: сб–пн · Тайп: вт–чт · Бета: пт–сб",
          chapters: [
            {
              id: "lotus-117",
              label: "117",
              done: makeDoneMap({ clean: true, translate: true }),
              takenBy: makeTakenByMap({}),
              roleDeadlines: makeDeadlinesMap({ edit: "23.11", sound: "23.11" }),
              isEditing: false
            },
            {
              id: "lotus-118",
              label: "118",
              done: makeDoneMap({ clean: true, translate: true }),
              takenBy: makeTakenByMap({}),
              roleDeadlines: makeDeadlinesMap({ edit: "23.11", sound: "23.11" }),
              isEditing: false
            },
            {
              id: "lotus-119",
              label: "119",
              done: makeDoneMap({ clean: true }),
              takenBy: makeTakenByMap({}),
              roleDeadlines: makeDeadlinesMap({}),
              isEditing: false
            },
            {
              id: "lotus-120",
              label: "120",
              done: makeDoneMap({ clean: true }),
              takenBy: makeTakenByMap({}),
              roleDeadlines: makeDeadlinesMap({}),
              isEditing: false
            }
          ]
        },
        snow: {
          id: "snow",
          name: "Снег",
          status: "active",
          workflowMode: "classic",
          note: "По 1 главе · Без дедлайна · Внештатная 4-я глава оставлена для контроля",
          chapters: [
            {
              id: "snow-4",
              label: "4 (отстаёт)",
              done: makeDoneMap({}),
              takenBy: makeTakenByMap({}),
              roleDeadlines: makeDeadlinesMap({}),
              isEditing: false
            },
            {
              id: "snow-5",
              label: "5",
              done: makeDoneMap({ clean: true, translate: true }),
              takenBy: makeTakenByMap({}),
              roleDeadlines: makeDeadlinesMap({}),
              isEditing: false
            },
            {
              id: "snow-6",
              label: "6",
              done: makeDoneMap({ clean: true, translate: true }),
              takenBy: makeTakenByMap({}),
              roleDeadlines: makeDeadlinesMap({}),
              isEditing: false
            },
            {
              id: "snow-7",
              label: "7",
              done: makeDoneMap({ clean: true, translate: true }),
              takenBy: makeTakenByMap({}),
              roleDeadlines: makeDeadlinesMap({}),
              isEditing: false
            },
            {
              id: "snow-8",
              label: "8",
              done: makeDoneMap({ clean: true }),
              takenBy: makeTakenByMap({}),
              roleDeadlines: makeDeadlinesMap({}),
              isEditing: false
            }
          ]
        }
      }
    };

    let syncStatus = GOOGLE_SCRIPT_URL ? "подключение к Google Таблице..." : "укажите GOOGLE_SCRIPT_URL в коде";

    function normalizeProjectsMap(rawProjects) {
      const source = rawProjects || structuredClone(DEFAULT_STATE.projects);
      const normalized = {};
      Object.entries(source).forEach(([key, proj]) => {
        if (!proj) return;
        const wf = WORKFLOW_MODES[proj.workflowMode] ? proj.workflowMode : "classic";
        const st = PROJECT_STATUSES[proj.status] ? proj.status : "active";
        const rawChapters = Array.isArray(proj.chapters) ? proj.chapters : [];
        normalized[key] = {
          ...proj,
          status: st,
          workflowMode: wf,
          chapters: rawChapters.map(normalizeChapter)
        };
      });
      return normalized;
    }

    function normalizeUserBoundRoles(rawMap) {
      const cleanMap = {};
      if (!rawMap || typeof rawMap !== "object") return cleanMap;
      Object.entries(rawMap).forEach(([userKey, byProj]) => {
        if (!byProj || typeof byProj !== "object") return;
        cleanMap[userKey] = {};
        Object.entries(byProj).forEach(([projId, rolesArr]) => {
          cleanMap[userKey][projId] = Array.isArray(rolesArr) ? [...new Set(rolesArr)] : [];
        });
      });
      return cleanMap;
    }

    function normalizeKnownUsers(rawUsers) {
      const clean = {};
      if (!rawUsers || typeof rawUsers !== "object") return clean;
      Object.entries(rawUsers).forEach(([userKey, info]) => {
        if (!info || typeof info !== "object") return;
        clean[userKey] = {
          first_name: info.first_name || "",
          username: info.username || "",
          id: info.id || ""
        };
      });
      return clean;
    }

    function recordCurrentUserMeta() {
      const tgUser = getCurrentTgUser();
      const userKey = getCurrentUserKey();
      if (tgUser) {
        state.knownUsers = {
          ...normalizeKnownUsers(state.knownUsers),
          [userKey]: {
            first_name: tgUser.first_name || "",
            username: tgUser.username || "",
            id: tgUser.id || ""
          }
        };
      }
    }

    function getBoundRolesForUser(userBoundRoles, userKey, projectId) {
      if (!projectId) return [];
      const userObj = userBoundRoles && userBoundRoles[userKey];
      if (!userObj || !Array.isArray(userObj[projectId])) return [];
      return [...new Set(userObj[projectId])];
    }

    function setBoundRolesForUser(userBoundRoles, userKey, projectId, rolesList) {
      const next = normalizeUserBoundRoles(userBoundRoles);
      if (!next[userKey]) next[userKey] = {};
      next[userKey][projectId] = [...new Set(rolesList)];
      return next;
    }

    function getAllUserAssignments(userBoundRoles, projects, userKey) {
      const items = [];
      Object.values(projects || {}).forEach((proj) => {
        if (!proj) return;
        const bound = getBoundRolesForUser(userBoundRoles, userKey, proj.id);
        bound.forEach((roleId) => {
          const role = getRole(roleId);
          items.push({
            projectId: proj.id,
            projectName: proj.name,
            projectStatus: proj.status || "active",
            roleId: role.id,
            roleName: role.name
          });
        });
      });
      return items;
    }

    function getDirectoryMembers() {
      const keys = new Set([
        ...Object.keys(state.userBoundRoles || {}),
        ...Object.keys(state.knownUsers || {})
      ]);
      const result = [];

      keys.forEach((userKey) => {
        const perProject = [];
        let totalRoles = 0;
        Object.values(state.projects || {}).forEach((proj) => {
          if (!proj) return;
          const bound = getBoundRolesForUser(state.userBoundRoles, userKey, proj.id);
          if (bound.length > 0) {
            totalRoles += bound.length;
            const roleNames = bound.map((rId) => getRole(rId).name).join(", ");
            perProject.push(`${proj.name}: ${roleNames}`);
          }
        });

        const meta = state.knownUsers && state.knownUsers[userKey];
        const label = formatTgUserLabel(meta, userKey);
        result.push({
          userKey,
          label,
          perProject,
          totalRoles
        });
      });

      result.sort((a, b) => {
        if (b.totalRoles !== a.totalRoles) return b.totalRoles - a.totalRoles;
        return a.label.localeCompare(b.label, "ru");
      });
      return result;
    }

    function syncSelectedRoleWithBound(projectId) {
      if (!projectId) return;
      const userKey = getCurrentUserKey();
      const bound = getBoundRolesForUser(state.userBoundRoles, userKey, projectId);
      if (bound.length > 0 && !bound.includes(state.selectedRoleId)) {
        state.selectedRoleId = bound[0];
      }
    }

    function normalizeLoadedState(parsed) {
      const merged = {
        ...structuredClone(DEFAULT_STATE),
        ...(parsed || {}),
        confirmDeleteProjectId: null,
        confirmDeleteUserKey: null,
        confirmReopenKey: null,
        showCompletedChapters: false,
        onlyMyRoles: parsed && typeof parsed.onlyMyRoles === "boolean" ? parsed.onlyMyRoles : true,
        userBoundRoles: normalizeUserBoundRoles(parsed && parsed.userBoundRoles),
        knownUsers: normalizeKnownUsers(parsed && parsed.knownUsers),
        projects: normalizeProjectsMap(parsed && parsed.projects)
      };
      if (merged.mode === "lead" && !merged.leadUnlocked) {
        merged.mode = "member";
      }
      return merged;
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(DEFAULT_STATE);
        return normalizeLoadedState(JSON.parse(raw));
      } catch (e) {
        return structuredClone(DEFAULT_STATE);
      }
    }

    let state = loadLocalState();
    recordCurrentUserMeta();
    syncSelectedRoleWithBound(state.selectedProjectId);

    function saveLocalState() {
      try {
        const toSave = {
          ...state,
          confirmDeleteProjectId: null,
          confirmDeleteUserKey: null,
          confirmReopenKey: null,
          showCompletedChapters: false
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
      } catch (e) {}
    }

    function getSharedPayload() {
      return {
        selectedProjectId: state.selectedProjectId,
        userBoundRoles: state.userBoundRoles,
        knownUsers: state.knownUsers,
        projects: state.projects
      };
    }

    async function pushSharedState() {
      if (!GOOGLE_SCRIPT_URL) return;
      syncStatus = "сохранение в Google Таблицу...";
      render();
      try {
        const res = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({ state: getSharedPayload() })
        });
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        const data = await res.json();
        if (!data || !data.ok) {
          throw new Error((data && data.error) || "Ошибка записи");
        }
        syncStatus = "сохранено в Google Таблицу";
      } catch (err) {
        syncStatus = "ошибка записи в таблицу (сохранено локально)";
      }
      render();
    }

    async function pullSharedState() {
      if (!GOOGLE_SCRIPT_URL) return;
      syncStatus = "загрузка из Google Таблицы...";
      render();
      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?t=${Date.now()}`);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        const data = await res.json();
        if (!data || !data.ok) {
          throw new Error((data && data.error) || "Ошибка чтения");
        }
        if (data.state) {
          const remote = data.state;
          const remoteUserMap = normalizeUserBoundRoles(remote.userBoundRoles);
          const mergedUserMap = normalizeUserBoundRoles(state.userBoundRoles);

          Object.entries(remoteUserMap).forEach(([uKey, projMap]) => {
            mergedUserMap[uKey] = projMap;
          });

          const mergedKnownUsers = {
            ...normalizeKnownUsers(state.knownUsers),
            ...normalizeKnownUsers(remote.knownUsers)
          };

          const nextProjectId = remote.selectedProjectId || state.selectedProjectId;
          state = normalizeLoadedState({
            ...state,
            selectedProjectId: nextProjectId,
            userBoundRoles: mergedUserMap,
            knownUsers: mergedKnownUsers,
            projects: remote.projects || state.projects
          });
          recordCurrentUserMeta();
          syncSelectedRoleWithBound(nextProjectId);
          saveLocalState();
          syncStatus = "Google Таблица подключена";
        } else {
          await pushSharedState();
        }
      } catch (err) {
        syncStatus = "ошибка чтения таблицы (работает локально)";
      }
      render();
    }

    function saveState(syncShared = true) {
      saveLocalState();
      if (syncShared) {
        pushSharedState();
      }
    }

    function openLeadTab() {
      if (state.leadUnlocked) {
        state.mode = "lead";
        state.showLeadAuthPrompt = false;
        state.leadAuthError = false;
        saveState(false);
        render();
        return;
      }
      state.showLeadAuthPrompt = true;
      state.leadAuthError = false;
      render();
    }

    function submitLeadPasscode(code) {
      if ((code || "").trim() === LEAD_PASSCODE) {
        state.leadUnlocked = true;
        state.mode = "lead";
        state.showLeadAuthPrompt = false;
        state.leadAuthError = false;
        saveState(false);
        render();
      } else {
        state.leadAuthError = true;
        render();
      }
    }

    function lockLeadMode() {
      state.leadUnlocked = false;
      state.mode = "member";
      state.showLeadAuthPrompt = false;
      state.leadAuthError = false;
      state.confirmDeleteProjectId = null;
      state.confirmDeleteUserKey = null;
      state.confirmReopenKey = null;
      state.showCompletedChapters = false;
      saveState(false);
      render();
    }

    function getRole(roleId) {
      return ROLES.find((r) => r.id === roleId) || ROLES[0];
    }

    function getWorkflowMode(project) {
      const code = (project && project.workflowMode) || "classic";
      return WORKFLOW_MODES[code] || WORKFLOW_MODES.classic;
    }

    function getRoleDeps(project, roleId) {
      const wf = getWorkflowMode(project);
      return wf.deps[roleId] || [];
    }

    function isProjectActive(project) {
      return (project.status || "active") === "active";
    }

    function getMissingDeps(project, chapter, roleId) {
      const deps = getRoleDeps(project, roleId);
      return deps.filter((depId) => !chapter.done[depId]);
    }

    function isUnlockedForRole(project, chapter, roleId) {
      return getMissingDeps(project, chapter, roleId).length === 0;
    }

    function selectAssignment(projectId, roleId) {
      state.selectedProjectId = projectId;
      state.selectedRoleId = roleId;
      state.confirmDeleteProjectId = null;
      state.confirmDeleteUserKey = null;
      state.confirmReopenKey = null;
      state.showCompletedChapters = false;
      saveState(true);
      render();
    }

    function toggleRoleBinding(projectId, roleId) {
      const project = state.projects[projectId];
      if (!project || !isProjectActive(project)) return;
      recordCurrentUserMeta();
      const userKey = getCurrentUserKey();
      const list = getBoundRolesForUser(state.userBoundRoles, userKey, projectId);
      const nextList = list.includes(roleId)
        ? list.filter((id) => id !== roleId)
        : [...list, roleId];
      state.userBoundRoles = setBoundRolesForUser(state.userBoundRoles, userKey, projectId, nextList);
      saveState(true);
      render();
    }

    function takeChapterInWork(projectId, chapterId, roleId) {
      const project = state.projects[projectId];
      if (!project || !isProjectActive(project)) return;
      const ch = project.chapters.find((c) => c.id === chapterId);
      if (!ch) return;
      if (ch.done[roleId] || !isUnlockedForRole(project, ch, roleId)) return;
      recordCurrentUserMeta();
      if (!ch.takenBy) ch.takenBy = makeTakenByMap({});
      ch.takenBy[roleId] = getActorDisplayName();
      state.confirmReopenKey = null;
      saveState(true);
      render();
    }

    function releaseChapterFromWork(projectId, chapterId, roleId) {
      const project = state.projects[projectId];
      if (!project || !isProjectActive(project)) return;
      const ch = project.chapters.find((c) => c.id === chapterId);
      if (!ch) return;
      if (!ch.takenBy) ch.takenBy = makeTakenByMap({});
      ch.takenBy[roleId] = "";
      saveState(true);
      render();
    }

    function askReopenChapterDone(projectId, chapterId, roleId) {
      state.confirmReopenKey = `${projectId}::${chapterId}::${roleId}`;
      render();
    }

    function cancelReopenChapterDone() {
      state.confirmReopenKey = null;
      render();
    }

    function setChapterDone(projectId, chapterId, roleId, value, skipConfirm = false) {
      const project = state.projects[projectId];
      if (!project || !isProjectActive(project)) return;
      const ch = project.chapters.find((c) => c.id === chapterId);
      if (!ch) return;
      if (value && !isUnlockedForRole(project, ch, roleId)) return;
      if (!value && !skipConfirm) {
        askReopenChapterDone(projectId, chapterId, roleId);
        return;
      }
      ch.done[roleId] = Boolean(value);
      if (!ch.takenBy) ch.takenBy = makeTakenByMap({});
      if (value) {
        ch.takenBy[roleId] = "";
      }
      state.confirmReopenKey = null;
      saveState(true);
      render();
    }

    function setProjectStatus(projectId, nextStatus) {
      if (!state.leadUnlocked) return;
      const project = state.projects[projectId];
      if (!project || !PROJECT_STATUSES[nextStatus]) return;
      project.status = nextStatus;
      if (nextStatus !== "active") {
        project.chapters.forEach((c) => { c.isEditing = false; });
      }
      saveState(true);
      render();
    }

    function setProjectWorkflowMode(projectId, nextMode) {
      if (!state.leadUnlocked) return;
      const project = state.projects[projectId];
      if (!project || !isProjectActive(project)) return;
      if (!WORKFLOW_MODES[nextMode]) return;
      project.workflowMode = nextMode;
      saveState(true);
      render();
    }

    function createProject(name, note) {
      if (!state.leadUnlocked) return;
      const cleanName = (name || "").trim();
      if (!cleanName) return;
      const id = `proj-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
      state.projects[id] = {
        id,
        name: cleanName,
        status: "active",
        workflowMode: "classic",
        note: (note || "").trim() || "Новый проект · Статус: В работе",
        chapters: []
      };
      state.selectedProjectId = id;
      state.confirmDeleteProjectId = null;
      state.confirmReopenKey = null;
      saveState(true);
      render();
    }

    function askDeleteProject(projectId) {
      if (!state.leadUnlocked) return;
      const ids = Object.keys(state.projects);
      if (ids.length <= 1 || !state.projects[projectId]) return;
      state.confirmDeleteProjectId = projectId;
      render();
    }

    function cancelDeleteProject() {
      state.confirmDeleteProjectId = null;
      render();
    }

    function confirmDeleteProject(projectId) {
      if (!state.leadUnlocked) return;
      const ids = Object.keys(state.projects);
      if (ids.length <= 1 || !state.projects[projectId]) return;

      delete state.projects[projectId];
      Object.keys(state.userBoundRoles).forEach((uKey) => {
        if (state.userBoundRoles[uKey]) {
          delete state.userBoundRoles[uKey][projectId];
        }
      });
      state.confirmDeleteProjectId = null;

      if (state.selectedProjectId === projectId) {
        const remainingIds = Object.keys(state.projects);
        state.selectedProjectId = remainingIds[0] || "";
      }
      syncSelectedRoleWithBound(state.selectedProjectId);

      saveState(true);
      render();
    }

    function toggleEditChapter(projectId, chapterId) {
      if (!state.leadUnlocked) return;
      const project = state.projects[projectId];
      if (!project || !isProjectActive(project)) return;
      const ch = project.chapters.find((c) => c.id === chapterId);
      if (!ch) return;
      ch.isEditing = !ch.isEditing;
      render();
    }

    function updateChapterField(projectId, chapterId, field, value) {
      if (!state.leadUnlocked) return;
      const project = state.projects[projectId];
      if (!project || !isProjectActive(project)) return;
      const ch = project.chapters.find((c) => c.id === chapterId);
      if (!ch) return;
      ch[field] = value;
      saveState(true);
    }

    function updateRoleDeadline(projectId, chapterId, roleId, value) {
      if (!state.leadUnlocked) return;
      const project = state.projects[projectId];
      if (!project || !isProjectActive(project)) return;
      const ch = project.chapters.find((c) => c.id === chapterId);
      if (!ch) return;
      ch.roleDeadlines[roleId] = value;
      saveState(true);
      render();
    }

    function clearRoleDeadline(projectId, chapterId, roleId) {
      updateRoleDeadline(projectId, chapterId, roleId, "");
    }

    function deleteChapter(projectId, chapterId) {
      if (!state.leadUnlocked) return;
      const project = state.projects[projectId];
      if (!project || !isProjectActive(project)) return;
      project.chapters = project.chapters.filter((c) => c.id !== chapterId);
      saveState(true);
      render();
    }

    function addChapter(projectId, label) {
      if (!state.leadUnlocked) return;
      const project = state.projects[projectId];
      if (!project || !isProjectActive(project)) return;
      const cleanLabel = (label || "").trim();
      if (!cleanLabel) return;
      project.chapters.push({
        id: `${projectId}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
        label: cleanLabel,
        done: makeDoneMap({}),
        takenBy: makeTakenByMap({}),
        roleDeadlines: makeDeadlinesMap({}),
        isEditing: false
      });
      saveState(true);
      render();
    }

    function renderChapterCardForMember(project, ch, currentRole, activeProject, statusLabel, currentRoleDeps) {
      const missing = getMissingDeps(project, ch, currentRole.id);
      const unlocked = missing.length === 0;
      const isDone = Boolean(ch.done[currentRole.id]);
      const takenBy = (!isDone && ch.takenBy && ch.takenBy[currentRole.id]) || "";
      const isTaken = Boolean(takenBy);
      const roleDeadline = (ch.roleDeadlines && ch.roleDeadlines[currentRole.id]) || "";
      const missingNames = missing.map((id) => getRole(id).name).join(" + ");
      const reopenKey = `${project.id}::${ch.id}::${currentRole.id}`;
      const isConfirmingReopen = state.confirmReopenKey === reopenKey;

      const cardClasses = [
        "chapter-card",
        !activeProject ? "archived" : isDone ? "done-muted" : !unlocked ? "locked" : ""
      ].filter(Boolean).join(" ");

      let statusBadge = "";
      if (!activeProject) {
        statusBadge = `<span class="badge closed">${escapeHtml(statusLabel)}</span>`;
      } else if (isDone) {
        statusBadge = `<span class="badge ok">Готово</span>`;
      } else if (!unlocked) {
        statusBadge = `<span class="badge">Ожидает: ${escapeHtml(missingNames)}</span>`;
      } else if (isTaken) {
        statusBadge = `<span class="badge work">В работе · ${escapeHtml(takenBy)}</span>`;
      } else {
        statusBadge = `<span class="badge avail">Свободно</span>`;
      }

      let actionButtons = "";
      if (!activeProject) {
        actionButtons = `<button class="btn-small" disabled>Закрыто</button>`;
      } else if (isDone) {
        actionButtons = `<button class="btn-small btn-reopen" onclick="setChapterDone('${project.id}', '${ch.id}', '${currentRole.id}', false)">Вернуть в работу</button>`;
      } else if (!unlocked) {
        actionButtons = `<button class="btn-small" disabled>Недоступно</button>`;
      } else if (isTaken) {
        actionButtons = `
          <button class="btn-small btn-done" onclick="setChapterDone('${project.id}', '${ch.id}', '${currentRole.id}', true)">Готово</button>
          <button class="btn-small" onclick="releaseChapterFromWork('${project.id}', '${ch.id}', '${currentRole.id}')">Отпустить</button>
        `;
      } else {
        actionButtons = `<button class="btn-small btn-take" onclick="takeChapterInWork('${project.id}', '${ch.id}', '${currentRole.id}')">Взять в работу</button>`;
      }

      return `
        <div class="${cardClasses}">
          <div class="chapter-head">
            <div class="row">
              <span class="chapter-title">Глава ${escapeHtml(ch.label)}</span>
              ${statusBadge}
              <span class="badge">${roleDeadline ? `Дедлайн: ${escapeHtml(roleDeadline)}` : "Без дедлайна"}</span>
            </div>
            <div class="row">
              ${actionButtons}
            </div>
          </div>

          ${
            isConfirmingReopen && activeProject && isDone
              ? `
                <div class="confirm-warn-box">
                  <span style="font-size: 13px;">
                    Вернуть этап <strong>«${escapeHtml(currentRole.name)}»</strong> на главе <strong>${escapeHtml(ch.label)}</strong> в работу?
                  </span>
                  <div class="row">
                    <button class="btn-small btn-reopen" onclick="setChapterDone('${project.id}', '${ch.id}', '${currentRole.id}', false, true)">Да</button>
                    <button class="btn-small" onclick="cancelReopenChapterDone()">Нет</button>
                  </div>
                </div>
              `
              : ""
          }

          <div class="meta-line">
            ${
              currentRoleDeps.length
                ? `Зависимости роли «${escapeHtml(currentRole.name)}»: ${currentRoleDeps.map((d) => escapeHtml(getRole(d).name)).join(" + ")}`
                : `Роль «${escapeHtml(currentRole.name)}» не ждёт предыдущих этапов`
            }
          </div>

          <div class="roles-summary">
            ${ROLES.map((r) => {
              const done = Boolean(ch.done[r.id]);
              const whoTook = (!done && ch.takenBy && ch.takenBy[r.id]) || "";
              const ready = !done && !whoTook && activeProject && isUnlockedForRole(project, ch, r.id);
              const dl = ch.roleDeadlines && ch.roleDeadlines[r.id];
              const icon = done ? "✓" : whoTook ? "●" : ready ? "▸" : "○";
              const cls = done ? "done" : whoTook ? "taken" : ready ? "ready" : "";
              const whoSuffix = whoTook ? ` · ${whoTook}` : "";
              const dlSuffix = dl ? ` (${dl})` : "";
              return `
                <span class="role-mini ${cls}">
                  ${icon} ${escapeHtml(r.name)}${escapeHtml(whoSuffix)}${escapeHtml(dlSuffix)}
                </span>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function render() {
      const isMemberView = state.mode === "member" || !state.leadUnlocked;
      const userKey = getCurrentUserKey();
      const assignments = getAllUserAssignments(state.userBoundRoles, state.projects, userKey);
      const hasAnyAssignment = assignments.length > 0;
      const myRolesCompact = isMemberView && state.onlyMyRoles && hasAnyAssignment;

      let project = null;
      let currentRole = getRole(state.selectedRoleId);

      if (myRolesCompact) {
        const matched = assignments.find(
          (a) => a.projectId === state.selectedProjectId && a.roleId === state.selectedRoleId
        ) || assignments[0];
        project = state.projects[matched.projectId];
        currentRole = getRole(matched.roleId);
        if (state.selectedProjectId !== project.id || state.selectedRoleId !== currentRole.id) {
          state.selectedProjectId = project.id;
          state.selectedRoleId = currentRole.id;
        }
      } else {
        const projectList = Object.values(state.projects);
        project = state.projects[state.selectedProjectId] || projectList[0] || null;
        if (project && state.selectedProjectId !== project.id) {
          state.selectedProjectId = project.id;
        }
      }

      const projectList = Object.values(state.projects);
      const boundRolesInProject = project ? getBoundRolesForUser(state.userBoundRoles, userKey, project.id) : [];
      const activeProject = project ? isProjectActive(project) : false;
      const statusLabel = project ? (PROJECT_STATUSES[project.status || "active"] || "В работе") : "";
      const workflow = project ? getWorkflowMode(project) : WORKFLOW_MODES.classic;
      const currentRoleDeps = project ? getRoleDeps(project, currentRole.id) : [];
      const canDeleteProject = projectList.length > 1 && Boolean(project);

      const tgUser = getCurrentTgUser();
      const userLabel = formatTgUserLabel(tgUser, "Локальный профиль");

      let html = `
        <div class="topbar">
          <div>
            <h1>Трекер глав команды</h1>
            <div class="sub">${escapeHtml(userLabel)} · ${escapeHtml(syncStatus)}</div>
          </div>
          <div class="mode-switch">
            <button class="btn-small" onclick="pullSharedState()" title="Обновить данные из Google Таблицы">↻ Обновить</button>
            <button class="${state.mode === "member" ? "active" : ""}" onclick="state.mode='member'; state.showLeadAuthPrompt=false; state.confirmDeleteProjectId=null; state.confirmDeleteUserKey=null; state.confirmReopenKey=null; saveState(false); render();">Участник</button>
            <button class="${state.mode === "lead" ? "active" : ""}" onclick="openLeadTab()">${state.leadUnlocked ? "Руководство" : "🔒 Руководство"}</button>
            ${state.leadUnlocked ? `<button class="btn-small" onclick="lockLeadMode()">Заблокировать</button>` : ""}
          </div>
        </div>
      `;

      if (state.showLeadAuthPrompt && !state.leadUnlocked) {
        html += `
          <div class="panel">
            <div class="chapter-title" style="margin-bottom: 6px;">Вход в режим руководства</div>
            <div class="sub" style="margin-bottom: 10px;">
              Редактировать проекты, главы и дедлайны могут только люди с паролем руководства.
            </div>
            <div class="add-form">
              <input type="password" class="compact" id="lead-pass-input" placeholder="Введите пароль" onkeydown="if(event.key==='Enter') submitLeadPasscode(this.value)" />
              <button onclick="submitLeadPasscode(document.getElementById('lead-pass-input').value)">Войти</button>
              <button class="btn-small" onclick="state.showLeadAuthPrompt=false; state.leadAuthError=false; render();">Отмена</button>
              ${state.leadAuthError ? `<span class="badge err">Неверный пароль</span>` : ""}
            </div>
          </div>
        `;
      }

      if (project) {
        html += `
          <div class="panel ${!activeProject ? "archived" : ""}">
            <div class="panel-head">
              <span class="label-inline">${myRolesCompact ? "Мои тайтлы и роли:" : "Проект:"}</span>
              ${
                isMemberView
                  ? `
                    <button
                      class="btn-small ${myRolesCompact ? "active" : ""}"
                      ${!hasAnyAssignment ? "disabled title='Сначала закрепите хотя бы одну роль звёздочкой ★'" : ""}
                      onclick="state.onlyMyRoles = !state.onlyMyRoles; state.confirmReopenKey=null; state.showCompletedChapters=false; saveState(false); render();"
                    >
                      ${myRolesCompact ? "★ Только мои роли" : "Показать только мои роли"}
                    </button>
                  `
                  : ""
              }
            </div>

            ${
              myRolesCompact
                ? `
                  <div class="row" style="margin-bottom: 10px;">
                    ${assignments.map((item) => {
                      const isSelected = item.projectId === project.id && item.roleId === currentRole.id;
                      const closedTag = item.projectStatus !== "active" ? ` · ${PROJECT_STATUSES[item.projectStatus]}` : "";
                      return `
                        <button class="${isSelected ? "active" : ""}" onclick="selectAssignment('${item.projectId}', '${item.roleId}')">
                          ${escapeHtml(item.projectName)} (${escapeHtml(item.roleName)})${escapeHtml(closedTag)}
                        </button>
                      `;
                    }).join("")}
                  </div>
                `
                : `
                  <div class="row" style="margin-bottom: 10px;">
                    ${projectList.map((p) => {
                      const pClosed = (p.status || "active") !== "active";
                      return `
                        <button class="${p.id === project.id ? "active" : ""}" onclick="state.selectedProjectId='${p.id}'; state.confirmDeleteProjectId=null; state.confirmReopenKey=null; state.showCompletedChapters=false; syncSelectedRoleWithBound('${p.id}'); saveState(true); render();">
                          ${escapeHtml(p.name)}${pClosed ? ` (${escapeHtml(PROJECT_STATUSES[p.status])})` : ""}
                        </button>
                      `;
                    }).join("")}
                  </div>
                `
            }

            <div class="row">
              <span class="badge ${activeProject ? "ok" : "closed"}">Статус: ${escapeHtml(statusLabel)}</span>
              <span class="badge">Режим: ${escapeHtml(workflow.label)}</span>
              ${myRolesCompact ? `<span class="badge work">Роль: ${escapeHtml(currentRole.name)}</span>` : ""}
              <span class="sub">${escapeHtml(project.note)}</span>
            </div>
          </div>
        `;
      }

      if (isMemberView) {
        if (project) {
          if (!myRolesCompact) {
            html += `
              <div class="panel ${!activeProject ? "archived" : ""}">
                <div class="row" style="margin-bottom: 8px;">
                  <span class="label-inline">Ваша роль:</span>
                  ${ROLES.map((r) => {
                    const isBound = boundRolesInProject.includes(r.id);
                    return `
                      <button class="role-chip ${r.id === currentRole.id ? "active" : ""} ${isBound ? "bound" : ""}" onclick="state.selectedRoleId='${r.id}'; state.confirmReopenKey=null; state.showCompletedChapters=false; saveState(false); render();">
                        ${escapeHtml(r.name)}
                      </button>
                    `;
                  }).join("")}
                </div>
                <div class="row">
                  <button class="btn-small" ${!activeProject ? "disabled" : ""} onclick="toggleRoleBinding('${project.id}', '${currentRole.id}')">
                    ${boundRolesInProject.includes(currentRole.id) ? "★ Роль закреплена за профилем (убрать)" : "☆ Закрепить роль за профилем"}
                  </button>
                  <span class="sub">
                    ${
                      !activeProject
                        ? `Проект в статусе «${escapeHtml(statusLabel)}»: закрепление ролей и отметки закрыты`
                        : hasAnyAssignment
                          ? "Закреплённые роли отмечены ★; нажмите «Только мои роли» вверху, чтобы оставить только свои плашки"
                          : "Закрепите роль звёздочкой ★, чтобы вверху появился режим «Только мои роли»"
                    }
                  </span>
                </div>
              </div>
            `;
          }

          if (project.chapters.length === 0) {
            html += `<div class="panel"><div class="sub">Глав пока нет.</div></div>`;
          } else {
            const doneChapters = project.chapters.filter((ch) => Boolean(ch.done[currentRole.id]));
            const activeQueueChapters = project.chapters.filter((ch) => !Boolean(ch.done[currentRole.id]));

            html += `
              <div class="list-toolbar">
                <div class="row">
                  <button
                    class="btn-small ${!state.showCompletedChapters ? "active" : ""}"
                    onclick="state.showCompletedChapters=false; state.confirmReopenKey=null; render();"
                  >
                    В очереди (${activeQueueChapters.length})
                  </button>
                  <button
                    class="btn-small ${state.showCompletedChapters ? "active" : ""}"
                    onclick="state.showCompletedChapters=true; state.confirmReopenKey=null; render();"
                  >
                    Сделанные (${doneChapters.length})
                  </button>
                </div>
                <span class="sub">
                  ${
                    state.showCompletedChapters
                      ? `Главы, где роль «${escapeHtml(currentRole.name)}» уже отмечена готовой`
                      : `Нажмите «Взять в работу», чтобы показать напарникам и руководству, что глава взята`
                  }
                </span>
              </div>
            `;

            if (state.showCompletedChapters) {
              if (doneChapters.length === 0) {
                html += `<div class="panel"><div class="sub">По роли «${escapeHtml(currentRole.name)}» пока нет сделанных глав.</div></div>`;
              } else {
                doneChapters.forEach((ch) => {
                  html += renderChapterCardForMember(project, ch, currentRole, activeProject, statusLabel, currentRoleDeps);
                });
              }
            } else {
              if (activeQueueChapters.length === 0) {
                html += `
                  <div class="panel">
                    <div class="sub">Все главы по роли «${escapeHtml(currentRole.name)}» уже сделаны. Откройте вкладку «Сделанные (${doneChapters.length})», чтобы посмотреть их.</div>
                  </div>
                `;
              } else {
                activeQueueChapters.forEach((ch) => {
                  html += renderChapterCardForMember(project, ch, currentRole, activeProject, statusLabel, currentRoleDeps);
                });
              }
            }
          }
        }
      } else {
        html += `
          <div class="panel">
            <div class="chapter-title" style="margin-bottom: 8px;">Создать новый проект</div>
            <div class="add-form">
              <input type="text" class="compact" id="new-proj-name" placeholder="Название манги / проекта" />
              <input type="text" class="compact" style="min-width: 220px;" id="new-proj-note" placeholder="Заметка о сроках / режиме (опц.)" />
              <button onclick="createProject(document.getElementById('new-proj-name').value, document.getElementById('new-proj-note').value)">+ Создать проект</button>
            </div>
          </div>
        `;

        if (project) {
          const isAskingDelete = state.confirmDeleteProjectId === project.id;

          html += `
            <div class="panel ${!activeProject ? "archived" : ""}">
              <div class="row" style="justify-content: space-between; margin-bottom: 10px;">
                <div class="row">
                  <span class="chapter-title">Проект «${escapeHtml(project.name)}»</span>
                  <span class="badge ${activeProject ? "ok" : "closed"}">${escapeHtml(statusLabel)}</span>
                </div>
                <div class="row">
                  <span class="label-inline">Статус:</span>
                  <select onchange="setProjectStatus('${project.id}', this.value)">
                    <option value="active" ${(project.status || "active") === "active" ? "selected" : ""}>В работе</option>
                    <option value="on_hold" ${project.status === "on_hold" ? "selected" : ""}>На перерыве</option>
                    <option value="completed" ${project.status === "completed" ? "selected" : ""}>Завершено</option>
                    <option value="dropped" ${project.status === "dropped" ? "selected" : ""}>Брошено</option>
                  </select>
                  <button
                    class="btn-small btn-danger"
                    ${!canDeleteProject ? "disabled title='Нельзя удалить последний оставшийся проект'" : ""}
                    onclick="askDeleteProject('${project.id}')"
                  >
                    Удалить проект
                  </button>
                </div>
              </div>

              <div class="row" style="margin-bottom: 10px;">
                <span class="label-inline">Режим этапов:</span>
                <select ${!activeProject ? "disabled" : ""} onchange="setProjectWorkflowMode('${project.id}', this.value)">
                  ${Object.entries(WORKFLOW_MODES).map(([key, cfg]) => `
                    <option value="${key}" ${(project.workflowMode || "classic") === key ? "selected" : ""}>${escapeHtml(cfg.label)}</option>
                  `).join("")}
                </select>
              </div>

              ${
                isAskingDelete
                  ? `
                    <div class="confirm-box">
                      <span style="font-size: 13px;">
                        Уверены, что хотите удалить проект <strong>«${escapeHtml(project.name)}»</strong> со всеми его главами?
                      </span>
                      <div class="row">
                        <button class="btn-small btn-danger-solid" onclick="confirmDeleteProject('${project.id}')">Да</button>
                        <button class="btn-small" onclick="cancelDeleteProject()">Нет</button>
                      </div>
                    </div>
                  `
                  : ""
              }

              <div class="add-form" style="margin-top: 10px;">
                <input type="text" class="compact" id="new-chap-label" placeholder="Номер главы (напр. 121)" ${!activeProject ? "disabled" : ""} />
                <button ${!activeProject ? "disabled" : ""} onclick="addChapter('${project.id}', document.getElementById('new-chap-label').value)">+ Добавить главу</button>
              </div>
              <div class="hint">
                ${
                  activeProject
                    ? "✓ — выполнено, ● — взято в работу (с указанием исполнителя), ○ — не начато."
                    : `Проект имеет статус «${escapeHtml(statusLabel)}»: главы, дедлайны и закрепление ролей заблокированы до возврата статуса «В работе».`
                }
              </div>
            </div>
          `;

          project.chapters.forEach((ch) => {
            const deadlinesList = ROLES
              .filter((r) => ch.roleDeadlines && ch.roleDeadlines[r.id])
              .map((r) => `${r.name}: ${ch.roleDeadlines[r.id]}`);

            html += `
              <div class="chapter-card ${!activeProject ? "archived" : ""}">
                <div class="chapter-head">
                  <div class="row">
                    <span class="chapter-title">Глава ${escapeHtml(ch.label)}</span>
                    <span class="badge">${deadlinesList.length ? escapeHtml(deadlinesList.join(" · ")) : "Без дедлайнов"}</span>
                  </div>
                  <button class="btn-small ${ch.isEditing ? "active" : ""}" ${!activeProject ? "disabled" : ""} onclick="toggleEditChapter('${project.id}', '${ch.id}')">
                    ${ch.isEditing ? "Свернуть" : "Редактировать"}
                  </button>
                </div>

                <div class="roles-summary">
                  ${ROLES.map((r) => {
                    const done = Boolean(ch.done[r.id]);
                    const whoTook = (!done && ch.takenBy && ch.takenBy[r.id]) || "";
                    const dl = ch.roleDeadlines && ch.roleDeadlines[r.id];
                    const icon = done ? "✓" : whoTook ? "●" : "○";
                    const cls = done ? "done" : whoTook ? "taken" : "";
                    const takenText = whoTook ? ` · в работе: ${whoTook}` : "";
                    const dlText = dl ? ` (${dl})` : "";
                    return `
                      <span class="role-mini ${cls}">
                        ${icon} ${escapeHtml(r.name)}${escapeHtml(takenText)}${escapeHtml(dlText)}
                      </span>
                    `;
                  }).join("")}
                </div>

                ${
                  activeProject && ch.isEditing
                    ? `
                      <div class="editor-box">
                        <div class="row" style="margin-bottom: 10px;">
                          <span class="label-inline">Название / номер главы:</span>
                          <input type="text" class="compact" value="${escapeHtml(ch.label)}" onchange="updateChapterField('${project.id}', '${ch.id}', 'label', this.value); render();" />
                          <button class="btn-small btn-danger" style="margin-left:auto;" onclick="deleteChapter('${project.id}', '${ch.id}')">Удалить главу</button>
                        </div>

                        <div class="label-inline">Дедлайны по каждой роли:</div>
                        <div class="grid-roles">
                          ${ROLES.map((r) => {
                            const val = (ch.roleDeadlines && ch.roleDeadlines[r.id]) || "";
                            return `
                              <div class="role-dl-item">
                                <div class="role-dl-top">
                                  <span>${escapeHtml(r.name)}</span>
                                  ${val ? `<button class="btn-small" onclick="clearRoleDeadline('${project.id}', '${ch.id}', '${r.id}')">Очистить</button>` : `<span class="sub">нет</span>`}
                                </div>
                                <input type="text" placeholder="Напр. 23.11 или пт" value="${escapeHtml(val)}" onchange="updateRoleDeadline('${project.id}', '${ch.id}', '${r.id}', this.value)" />
                              </div>
                            `;
                          }).join("")}
                        </div>

                        <div class="row" style="margin-top: 8px;">
                          <button class="btn-small" onclick="toggleEditChapter('${project.id}', '${ch.id}')">Готово / Свернуть</button>
                        </div>
                      </div>
                    `
                    : ""
                }
              </div>
            `;
          });
        }

        const members = getDirectoryMembers();
        html += `
          <div class="panel">
            <div class="panel-head">
              <span class="chapter-title">Участники и закреплённые роли</span>
              <span class="badge">${members.length}</span>
            </div>
            <div class="sub" style="margin-bottom: 10px;">
              Удаление профиля очищает все его закреплённые роли по всем проектам и обновляет Google Таблицу.
            </div>
            ${
              members.length === 0
                ? `<div class="sub">Пока нет записей о закреплённых ролях или профилях.</div>`
                : members.map((m) => {
                    const isAskingUserDelete = state.confirmDeleteUserKey === m.userKey;
                    const escapedKey = m.userKey.replace(/'/g, "\\'");
                    return `
                      <div class="member-row">
                        <div>
                          <div style="font-size: 13px; font-weight: 600;">${escapeHtml(m.label)} <span class="sub">(${escapeHtml(m.userKey)})</span></div>
                          <div class="sub">${m.perProject.length ? escapeHtml(m.perProject.join(" · ")) : "Ролей пока нет"}</div>
                        </div>
                        <div class="row">
                          ${
                            isAskingUserDelete
                              ? `
                                <span class="sub">Удалить?</span>
                                <button class="btn-small btn-danger-solid" onclick="confirmRemoveUser('${escapedKey}')">Да</button>
                                <button class="btn-small" onclick="cancelRemoveUser()">Нет</button>
                              `
                              : `<button class="btn-small btn-danger" onclick="askRemoveUser('${escapedKey}')">Удалить</button>`
                          }
                        </div>
                      </div>
                    `;
                  }).join("")
            }
          </div>
        `;
      }

      document.getElementById("app").innerHTML = html;
      if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
      }
    }

    render();
    pullSharedState();
  </script>
</body>
</html>
